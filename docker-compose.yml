version: '3.9'

services:
  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mysport-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-changeme_secure_key_here}
      - DATABASE_URL=/app/mysport.db
      - ALLOWED_ORIGINS=https://mysport.woutils.com
    volumes:
      - ./server/mysport.db:/app/mysport.db
      - ./server/node_modules:/app/node_modules
    restart: always
    networks:
      - mysport-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Build artifact served by Nginx)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=https://mysport.woutils.com/api
    container_name: mysport-frontend
    restart: always
    networks:
      - mysport-network
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mysport-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./server/mysport.db:/app/mysport.db:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - mysport-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mysport-network:
    driver: bridge

volumes:
  mysport_db:
